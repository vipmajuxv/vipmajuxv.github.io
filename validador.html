<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puerta VIP - XV Maju</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen overflow-hidden flex flex-col relative">

    <!-- PANTALLA 1: INGRESO DEL PIN -->
    <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-6 z-10">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center border border-gray-700">
            <h2 class="text-2xl font-bold text-gray-200 mb-2">Control de Acceso</h2>
            <p class="text-gray-400 text-sm mb-6">Ingresa el PIN de seguridad</p>
            
            <input type="password" id="pinInput" class="w-full text-center text-3xl tracking-[0.5em] p-4 rounded-xl bg-gray-900 border border-gray-600 text-white focus:outline-none focus:border-green-500 mb-6" placeholder="****">
            
            <button onclick="iniciarEscaner()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-green-500 transition shadow-lg">
                Iniciar Lector QR
            </button>
        </div>
    </div>

    <!-- PANTALLA 2: ESCÁNER ACTIVO -->
    <div id="scanner-screen" class="hidden flex-1 flex flex-col h-full w-full">
        <div class="bg-gray-900 text-center py-4 border-b border-gray-800 shadow-md z-10">
            <h3 class="text-gray-300 font-bold uppercase tracking-widest text-sm">Escaneando Pase VIP</h3>
        </div>
        
        <!-- Área de la cámara -->
        <div class="flex-1 w-full bg-black relative" id="reader"></div>
        
        <!-- Controles inferiores -->
        <div class="bg-gray-900 p-4 border-t border-gray-800 text-center z-10">
            <button onclick="location.reload()" class="text-gray-500 text-xs uppercase font-bold tracking-widest underline">Cerrar Sesión</button>
        </div>
    </div>

    <!-- PANTALLA 3: RESULTADO (SEMÁFORO) -->
    <div id="result-overlay" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-6 text-center transform transition-all duration-300">
        
        <div id="result-icon" class="text-8xl mb-4 drop-shadow-lg">✅</div>
        <h1 id="result-title" class="text-4xl md:text-5xl font-extrabold uppercase tracking-wider mb-2 drop-shadow-md">Acceso Permitido</h1>
        
        <div class="bg-black/30 p-6 rounded-2xl mb-8 w-full max-w-sm backdrop-blur-sm border border-white/20">
            <p id="result-name" class="text-2xl font-bold mb-1">-</p>
            <p id="result-type" class="text-sm uppercase tracking-widest font-semibold opacity-80">-</p>
        </div>

        <p id="result-message" class="text-lg mb-10 font-medium opacity-90 max-w-sm px-4">-</p>

        <!-- Botón Salida (Solo aparece si el pase ya había ingresado) -->
        <button id="btn-salida" onclick="registrarSalida()" class="hidden w-full max-w-sm border-2 border-white text-white bg-black/40 py-4 rounded-xl font-bold uppercase tracking-widest mb-4 hover:bg-white/20 transition">
            🚶 Registrar Salida
        </button>

        <button onclick="continuarEscaneando()" class="w-full max-w-sm bg-white/20 text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-white/30 transition shadow-lg border border-white/30 backdrop-blur-md">
            Escanear Otro
        </button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHbqAhbTvZcsISBmPB4bw7xthAzhw4T9Fyz4bzO3acgKRN8a0kC85CMGDvJL8b1-8sYw/exec';
        let currentPin = '';
        let lastScannedQR = '';
        let html5QrcodeScanner;

        // Recuperar PIN si ya había ingresado
        if(localStorage.getItem('puertaPin')) {
            document.getElementById('pinInput').value = localStorage.getItem('puertaPin');
        }

        function iniciarEscaner() {
            currentPin = document.getElementById('pinInput').value.trim();
            if(!currentPin) return alert("Ingresa el PIN");
            
            localStorage.setItem('puertaPin', currentPin); // Guarda el pin en el navegador

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('scanner-screen').classList.remove('hidden');
            
            // Iniciar librería HTML5-QRCode
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Evitar escanear el mismo código 10 veces en un segundo
            if (decodedText === lastScannedQR) return; 
            
            lastScannedQR = decodedText;
            html5QrcodeScanner.pause(true); // Pausar cámara mientras se consulta

            mostrarPantalla('bg-blue-600', '⏳', 'Procesando...', 'Consultando base de datos', '', '');
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'validateQR', qrCode: decodedText, pin: currentPin })
            })
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    if(data.status === 'INVALID_PIN') {
                        alert("PIN de seguridad incorrecto.");
                        localStorage.removeItem('puertaPin');
                        location.reload();
                    } else {
                        mostrarPantalla('bg-red-600', '❌', 'ERROR', 'Error del servidor', '', '');
                    }
                } else {
                    if(data.status === 'ALLOWED') {
                        // INGRESO ÉXITOSO (VERDE)
                        mostrarPantalla('bg-green-600', '✅', 'ACCESO PERMITIDO', '¡Bienvenido!', data.nombre, data.tipo);
                    } else if (data.status === 'ALREADY_ENTERED') {
                        // YA INGRESÓ (AMARILLO)
                        mostrarPantalla('bg-yellow-500', '⚠️', 'PASE YA USADO', 'Este invitado ingresó a las: ' + data.hora, data.nombre, 'ADENTRO');
                        document.getElementById('btn-salida').classList.remove('hidden'); // Mostrar botón de salida
                    } else if (data.status === 'NOT_FOUND') {
                        // NO EXISTE (ROJO)
                        mostrarPantalla('bg-red-600', '🚫', 'PASE INVÁLIDO', 'El código QR no existe o fue cancelado.', 'Desconocido', '-');
                    } else if (data.status === 'EXIT_REGISTERED') {
                        // SALIDA OK (VERDE CLARO)
                        mostrarPantalla('bg-emerald-500', '👋', 'SALIDA REGISTRADA', 'El invitado puede volver a ingresar.', data.nombre, 'SALIÓ');
                    }
                }
            })
            .catch(err => {
                mostrarPantalla('bg-red-700', '📶', 'SIN INTERNET', 'No se pudo conectar con el servidor.', '', '');
            });
        }

        function registrarSalida() {
            document.getElementById('btn-salida').classList.add('hidden');
            mostrarPantalla('bg-blue-600', '⏳', 'Procesando...', 'Registrando salida...', '', '');
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'validateQR', qrCode: lastScannedQR, pin: currentPin, markExit: true })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.status === 'EXIT_REGISTERED') {
                    mostrarPantalla('bg-emerald-500', '👋', 'SALIDA REGISTRADA', 'Pase liberado para reingreso.', data.nombre, 'SALIÓ');
                } else {
                    mostrarPantalla('bg-red-600', '❌', 'ERROR', 'No se pudo registrar la salida.', '', '');
                }
            }).catch(err => mostrarPantalla('bg-red-700', '📶', 'ERROR', 'Sin conexión.', '', ''));
        }

        function mostrarPantalla(bgColor, icon, title, message, name, type) {
            const overlay = document.getElementById('result-overlay');
            // Limpiar colores anteriores
            overlay.className = 'absolute inset-0 z-50 flex flex-col items-center justify-center p-6 text-center transform transition-all duration-300 ' + bgColor;
            
            document.getElementById('result-icon').innerText = icon;
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-message').innerText = message;
            
            document.getElementById('result-name').innerText = name || '-';
            document.getElementById('result-type').innerText = type || '';
            
            overlay.classList.remove('hidden');
        }

        function continuarEscaneando() {
            document.getElementById('result-overlay').classList.add('hidden');
            document.getElementById('btn-salida').classList.add('hidden');
            lastScannedQR = '';
            
            // Reanudar cámara
            if(html5QrcodeScanner) {
                html5QrcodeScanner.resume();
            }
        }
    </script>
</body>
</html>
